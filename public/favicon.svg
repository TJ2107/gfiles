<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="gf-badge-surface" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#2c3038" />
      <stop offset="48%" stop-color="#1a1c22" />
      <stop offset="85%" stop-color="#121317" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </radialGradient>

    <linearGradient id="gf-blue-gradient" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#00a8f3" />
      <stop offset="45%" stop-color="#008dd2" />
      <stop offset="100%" stop-color="#006fa8" />
    </linearGradient>

    <linearGradient id="gf-white-gradient" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="gf-blue-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="gf-f-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Full Bleed Squircle (Standard Icon Bounds) -->
  <rect x="12" y="12" width="488" height="488" rx="108" ry="108" fill="url(#gf-badge-surface)" stroke="#ffffff" stroke-width="14" />
  <rect x="22" y="22" width="468" height="468" rx="98" ry="98" fill="none" stroke="#475569" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Blue G Monogram -->
  <g filter="url(#gf-blue-shadow)">
    <path
      d="M 242 116
         A 140 140 0 0 0 95 256
         A 140 140 0 0 0 242 396
         L 242 336
         A 80 80 0 0 1 155 256
         A 80 80 0 0 1 242 176
         Z"
      fill="url(#gf-blue-gradient)"
    />
    <path
      d="M 278 130
         L 278 222
         L 305 222
         L 305 172
         L 335 138
         Z"
      fill="url(#gf-blue-gradient)"
    />
    <path
      d="M 248 228
         L 345 228
         L 345 378
         L 290 378
         L 290 290
         L 248 290
         Z"
      fill="url(#gf-blue-gradient)"
    />
  </g>

  <!-- White F Monogram -->
  <g filter="url(#gf-f-shadow)">
    <path
      d="M 240 80
         L 425 80
         L 425 142
         L 302 142
         L 302 228
         L 410 228
         L 410 290
         L 302 290
         L 302 432
         L 240 432
         L 240 290
         L 254 290
         L 254 228
         L 240 228
         Z"
      fill="url(#gf-white-gradient)"
    />
  </g>
</svg>
