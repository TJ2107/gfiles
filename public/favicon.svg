<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Glowing Lines Gradient -->
    <linearGradient id="tech-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="glow-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tech Background Badge -->
  <circle cx="250" cy="250" r="220" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />

  <!-- Cloud Outline (Data Infrastructure) -->
  <path d="M 160 280 
           A 45 45 0 0 1 180 195 
           A 65 65 0 0 1 305 175 
           A 50 50 0 0 1 350 250 
           A 40 40 0 0 1 330 320 
           L 170 320 
           A 40 40 0 0 1 160 280 Z" 
        fill="none" 
        stroke="url(#tech-blue)" 
        stroke-width="3" 
        stroke-dasharray="8 4"
        opacity="0.5" />

  <!-- Data Circuit Lines (Background) -->
  <g stroke="url(#tech-blue)" stroke-width="2" opacity="0.6" fill="none">
    <path d="M 130 250 L 170 250 M 150 220 L 180 220 M 330 220 L 370 220 M 320 270 L 360 270" />
    <path d="M 210 140 L 210 170 M 290 135 L 290 165" />
  </g>

  <!-- Main 'GF' Monogram Stylized as Data Streams -->
  <g filter="url(#glow)">
    <!-- Letter G -->
    <path d="M 225 210 
             C 180 200, 150 230, 150 265 
             C 150 305, 185 325, 225 315 
             L 225 270 
             L 195 270" 
          fill="none" 
          stroke="url(#glow-white)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Letter F -->
    <path d="M 265 315 
             L 265 210 
             L 325 210 
             M 265 260 
             L 310 260" 
          fill="none" 
          stroke="url(#tech-blue)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Data Nodes (Connecting Dots) -->
  <g fill="#38bdf8">
    <circle cx="195" cy="270" r="5" />
    <circle cx="325" cy="210" r="5" />
    <circle cx="310" cy="260" r="5" />
    <circle cx="130" cy="250" r="4" />
    <circle cx="370" cy="220" r="4" />
    <circle cx="210" cy="140" r="4" />
  </g>
  <g fill="#ffffff">
    <circle cx="225" cy="210" r="5" />
    <circle cx="265" cy="315" r="5" />
  </g>

  <!-- Text / Subtitle -->
  <text x="250" y="380" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="22" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="4">
    GLOBALFILES
  </text>
  
  <text x="250" y="402" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="11" 
        fill="#94a3b8" 
        text-anchor="middle" 
        letter-spacing="2">
    DATA &amp; CLOUD PLATFORM
  </text>
</svg>
